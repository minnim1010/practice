version: '3.8'

services:
  db:
    image: postgres:15
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: practice_sqlalchemy
    volumes:
      - practice_postgres_data:/var/lib/postgresql/data/

volumes:
  practice_postgres_data:
